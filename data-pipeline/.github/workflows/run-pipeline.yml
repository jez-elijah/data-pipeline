name: Run Pipeline (scheduled)

# Scheduling option #1 (simplest, free): let GitHub Actions itself be the
# scheduler, running the real extract -> validate -> load job against a
# hosted database on a cron. No servers to manage. For the AWS/Azure-hosted
# alternative, see aws/ (EventBridge-scheduled Lambda) and README.md.
on:
  schedule:
    - cron: "0 * * * *"   # hourly, on the hour
  workflow_dispatch: {}    # allow manual "Run workflow" trigger too

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          # Set DATABASE_URL as a repository secret pointing at your hosted
          # Postgres/MySQL instance (e.g. AWS RDS or Azure Database free tier).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m pipeline.main
